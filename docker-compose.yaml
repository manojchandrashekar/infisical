version: '3'
services:
  infisical:
    image: 'infisical/infisical:v0.162.13'
    ports:
      - '80:8080'
    environment:
      - SERVICE_URL_INFISICAL
      - 'SITE_URL=${SERVICE_URL_INFISICAL}'
      - 'NODE_ENV=${NODE_ENV:-production}'
      - 'ENCRYPTION_KEY=${SERVICE_ENCRYPTIONKEY}'
      - 'AUTH_SECRET=${SERVICE_REALBASE64_64_AUTHSECRET}'
      - 'SMTP_HOST=${SERVICE_SMTP_HOST}'
      - 'SMTP_USERNAME=${SERVICE_SMTP_USERNAME}'
      - 'SMTP_PASSWORD=${SERVICE_SMTP_PASSWORD}'
      - 'SMTP_PORT=${SERVICE_SMTP_PORT}'
      - 'SMTP_FROM_ADDRESS=${SERVICE_SMTP_FROM_ADDRESS}'
      - 'SMTP_FROM_NAME=${SERVICE_SMTP_FROM_NAME}'
      - 'DB_CONNECTION_URI=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@${SERVICE_NETBIRD_IP}:5432/${SERVICE_POSTGRES_DB}'
      - 'REDIS_URL=redis://${SERVICE_USER_REDIS}:${SERVICE_PASSWORD_REDIS}@${SERVICE_NETBIRD_IP}:6379'
      - 'HOST=${SERVICE_FQDN_INFISICAL}'
      - TELEMETRY_ENABLED=false
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/api/status || exit 1'
